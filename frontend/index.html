<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aegis: an encrypted dead-man's-switch legacy vault using Shamir's Secret Sharing." />
    <title>Aegis — encrypted legacy vault</title>
    <script>
      // Apply the saved theme before first paint (no flash). Keep in sync with src/theme.ts.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("aegis.theme"); } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
