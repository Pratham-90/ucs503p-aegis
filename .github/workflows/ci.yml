# CI for the prototype (the existing mkdocs.yml workflow still builds the docs site).
name: ci

on:
  push:
    branches: [main, prototype]
  pull_request:

jobs:
  python:
    name: Python — ruff, pytest, coverage (NFR-MAINT-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # crypto and scheduler must stay >= 80% covered (NFR-MAINT-1)
      - run: pytest -q --cov=code/crypto --cov=code/scheduler --cov-report=term --cov-fail-under=80

  frontend:
    name: Frontend — eslint, vitest (incl. Python<->TS vectors), build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end demo script (Playwright)
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            report-assets/screenshots/
            frontend/test-results/
