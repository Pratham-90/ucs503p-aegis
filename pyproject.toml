
[build-system]
requires = ["hatchling","hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ucs503p-aegis"  # was the template's path-like name, not a valid package name
version = "0.0.1"
authors = [
  { name="Raghav B. Venkataramaiyer", email="bv.raghav@thapar.edu" },
]
# maintainers = [
#   { name="Raghav B. Venkataramaiyer",
#     email="bvraghav@gmail.com" },
# ]
description = "UCS503 : Software Engineering : Project Sample"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    # See: https://pypi.org/classifiers/
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Unix Shell",
]
# Runtime dependencies of the API. Vercel installs from this file; keep it in step with
# requirements.txt (code/tests/test_dependencies.py checks they match).
dependencies = [
  "click",
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "email-validator>=2.2",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/tiet-ucs503/ucs503p-202627odd-template"
Issues = "https://github.com/tiet-unc512/ucs503p-202627odd-template/issues"

# Adapted from https://stackoverflow.com/a/50156706
[tool.pytest.ini_options]
pythonpath = [
  "code"
]
# The repository is not an installable package; uv only resolves the dependencies.
[tool.uv]
package = false
# THE END -------------------------------------------
